name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.byte --project-name byte_tycoon
          fi
          rm -f test/widget_test.dart

      - name: Set package name and app label
        run: |
          find android -name "build.gradle*" -exec sed -i 's/com\.byte\.byte_tycoon/com.byte.tycoon/g' {} +

          OLD_DIR="android/app/src/main/kotlin/com/byte/byte_tycoon"
          NEW_DIR="android/app/src/main/kotlin/com/byte/tycoon"

          if [ -d "$OLD_DIR" ]; then
            mkdir -p "$NEW_DIR"
            mv "$OLD_DIR"/*.kt "$NEW_DIR"/ 2>/dev/null || true
            find "$NEW_DIR" -name "*.kt" -exec sed -i 's/package com\.byte\.byte_tycoon/package com.byte.tycoon/' {} +
            rmdir "$OLD_DIR" 2>/dev/null || true
          fi

          sed -i 's/android:label="byte_tycoon"/android:label="Byte Tycoon"/' \
            android/app/src/main/AndroidManifest.xml || true

          if ! grep -q "^version:" pubspec.yaml; then
            sed -i '/^description:/a version: 1.0.0+1' pubspec.yaml
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: byte-tycoon-apk
          path: build/app/outputs/flutter-apk/app-release.apk
